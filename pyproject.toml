[project]
name = "py-start"
version = "0.1.0"
requires-python = ">=3.10.12"

dependencies = [
    "python-dotenv~=1.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "mypy~=1.9",
    "pytest",
]

[project.scripts]
pystart = "py_start.__main__:main"

[build-system]
requires = ["setuptools >= 61.2"]
build-backend = "setuptools.build_meta"

[tool.isort]
skip = [".direnv", "result"]

[tool.mypy]
# Strict mode settings
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

# Disable error code for 3rd party libraries without type stubs
disallow_any_unimported = false

# Extra assurance
disallow_subclassing_any = true
disallow_untyped_calls = true

# Improved error messages
pretty = true
show_column_numbers = true
show_error_context = true

# Exclude tests directory from type checking
# Tests are excluded to allow more flexible testing patterns and reduce
# type annotation overhead in test code. Production code in py_start/
# still requires full type annotations.
exclude = ["tests/"]

# [tool.setuptools.package-data]
