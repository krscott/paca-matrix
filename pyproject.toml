[project]
name = "paca-matrix"
version = "0.1.0"
requires-python = ">=3.10.12"

dependencies = [
    "python-dotenv~=1.0",
    "matrix-nio[e2e]>=0.24",
    "aiohttp~=3.9",
    "setproctitle>=1.3",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "mypy~=1.9",
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
paca = "paca_matrix.__main__:main"

[build-system]
requires = ["setuptools >= 61.2"]
build-backend = "setuptools.build_meta"

[tool.isort]
profile = "black"
skip = [".direnv", "result", ".venv"]

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
exclude = ["tests", "tests/**", ".direnv"]

[tool.mypy]
strict = true

# Improved error messages
pretty = true
show_column_numbers = true
show_error_context = true

exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["nio"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
exclude = ["result*"]

